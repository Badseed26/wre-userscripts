<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Panel">
<meta name="theme-color" content="#0D1015">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<title>Desk Panel</title>
<style>
  :root {
    --bg: #0D1015;
    --card: #161A21;
    --card-press: #1F2530;
    --chip: #1D222B;
    --line: #232934;
    --text: #EEF1F6;
    --soft: #C4CAD5;
    --muted: #8B93A3;
    --faint: #6B7383;
    --good: #5ED68A;
    --bad: #FF7A6B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font-family: inherit; }

  .wrap { padding: 36px 36px 40px; max-width: 1280px; margin: 0 auto; }

  header { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: flex-end; align-items: flex-end; margin-bottom: 26px; }
  .hello { font-size: 15px; font-weight: 500; color: var(--muted); }
  .time { font-size: 64px; font-weight: 300; letter-spacing: -2px; line-height: 1; margin-top: 4px; }
  .time small { font-size: 26px; font-weight: 400; letter-spacing: 0; margin-left: 8px; color: var(--muted); }
  .date { font-size: 15px; font-weight: 500; color: var(--soft); margin-top: 8px; }
  .right { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .right > * { margin-left: 10px; }
  .pill { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--soft); }
  .pill .ver { color: var(--faint); margin-left: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 10px; }
  .dot.on { background: var(--good); }
  .dot.off { background: var(--bad); }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line);
    color: var(--soft); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center; padding: 0; cursor: pointer; }
  .round.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  nav { display: -webkit-inline-flex; display: inline-flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px; margin-bottom: 26px; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav button { border: 0; border-radius: 999px; padding: 10px 18px; min-height: 44px; font-size: 15px; font-weight: 600;
    background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; margin-right: 4px; }
  nav button:last-child { margin-right: 0; }
  nav button.on { background: var(--text); color: var(--bg); }

  .editbar { display: none; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between;
    justify-content: space-between; background: var(--card); border: 1px dashed #3A4250; border-radius: 16px;
    padding: 12px 12px 12px 18px; margin-bottom: 18px; font-size: 15px; color: var(--soft); }
  .editing .editbar { display: -webkit-flex; display: flex; }
  .btn { border: 0; border-radius: 999px; padding: 11px 18px; min-height: 44px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.light { background: var(--text); color: var(--bg); }
  .btn.dark { background: var(--chip); color: var(--text); }

  .grid { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -8px; }
  .cell { width: 25%; padding: 8px; }
  @media (max-width: 900px) { .cell { width: 33.333%; } }
  @media (max-width: 560px) { .cell { width: 50%; } .wrap { padding: 24px 16px 32px; } .time { font-size: 48px; } .pill .ver { display: none; } }

  .tile { width: 100%; min-height: 140px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px;
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: space-between; justify-content: space-between; text-align: left; color: var(--text); cursor: pointer;
    -webkit-transition: -webkit-transform .12s ease, background-color .12s ease; transition: transform .12s ease, background-color .12s ease; }
  .tile:active { -webkit-transform: scale(.97); transform: scale(.97); background: var(--card-press); }
  .tile.ok { border-color: var(--good); }
  .tile.err { border-color: var(--bad); }
  .tile.busy { opacity: .7; }
  .tile.arm { background: #2A1D1B; border-color: var(--bad); }
  .editing .tile { border-style: dashed; border-color: #3A4250; }
  .top { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: flex-start; align-items: flex-start; }
  .badge { width: 48px; height: 48px; border-radius: 14px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center; overflow: hidden; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .badge img { width: 48px; height: 48px; object-fit: contain; display: block; }
  .badge.own { background: transparent; border-radius: 0; }
  .chip { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); background: var(--chip);
    border-radius: 999px; padding: 5px 9px; }
  .lbl { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; margin-top: 18px; }
  .sub { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 4px; }

  .msg { text-align: center; color: var(--muted); padding: 60px 24px; font-size: 16px; line-height: 1.5; }

  .toast { position: fixed; left: 50%; bottom: 28px; -webkit-transform: translateX(-50%); transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 999px; padding: 12px 20px; font-size: 15px; font-weight: 600;
    opacity: 0; -webkit-transition: opacity .2s; transition: opacity .2s; pointer-events: none; max-width: 90%; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); color: #1A0D0B; }

  .sheet-bg { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(5,7,10,.7); display: none;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; padding: 24px; }
  .sheet-bg.show { display: -webkit-flex; display: flex; }
  .sheet { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; text-align: center; }
  .sheet .badge { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 14px; }
  .sheet .badge img { width: 72px; height: 72px; }
  .sheet h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .sheet p { margin: 6px 0 20px; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .sheet .btn { display: block; width: 100%; margin-top: 10px; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div>
      <div class="hello" id="hello">Hello</div>
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>
    <div class="right">
      <div class="pill"><span class="dot" id="dot"></span><span id="stat">Connecting</span><span class="ver" id="ver"></span></div>
      <button class="round" id="updBtn" aria-label="Check for updates">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"></path></svg>
      </button>
      <button class="round" id="editBtn" aria-label="Change icons">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg>
      </button>
    </div>
  </header>

  <nav id="tabs" aria-label="Groups"></nav>

  <div class="editbar">
    <span>Tap a tile to change its icon</span>
    <button class="btn light" id="doneBtn">Done</button>
  </div>

  <div id="main"><div class="msg">Loading</div></div>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="badge" id="sheetBadge"></div>
    <h2 id="sheetTitle">Icon</h2>
    <p>Pick any image. It gets cropped square and saved on the PC.</p>
    <label class="btn light file-btn">Choose image<input type="file" accept="image/*" id="fileIn"></label>
    <button class="btn dark" id="resetBtn">Back to the default icon</button>
    <button class="btn dark" id="cancelBtn">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var KEY_STORE = "deskPanelKey", TAB_STORE = "deskPanelTab";
  var key = "", data = null, tab = "Favourites", editing = false, pcVersion = null, sheetBtn = null;

  var ICONS = {
    dash: "M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",
    brief: "M3 8h18v12H3zM8 8V5h8v3M3 13h18",
    mail: "M3 5h18v14H3zM3 6l9 7 9-7",
    inbox: "M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5",
    todo: "M4 6l2 2 3-3M4 13l2 2 3-3M12 7h8M12 14h8M4 19h16",
    house: "M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6",
    file: "M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7",
    check: "M9 3h6v3H9zM9 4.5H6v16.5h12V4.5h-3M9 14l2 2 4-4",
    mailopen: "M3 10l9-6 9 6v10H3zM3 10l9 6 9-6",
    cal: "M4 5h16v15H4zM4 10h16M8 3v4M16 3v4M8 14h3M8 17h6",
    users: "M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M18 15c2 .5 3 2.5 3 5",
    zap: "M13 2L4 14h7l-1 8 9-12h-7z",
    spark: "M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8zM19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z",
    clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",
    handoff: "M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-4 3-6 7-6 2 0 3.5.5 4.5 1.5M16 17h6M19 14l3 3-3 3",
    power: "M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0",
    list: "M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01",
    chat: "M4 4h16v12H9l-5 4zM8 9h8M8 12h5",
    shield: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4",
    pad: "M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4zM7 10.5v3M5.5 12h3M16 11h.01M18 13h.01",
    lock: "M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4",
    refresh: "M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4",
    branch: "M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9",
    folder: "M3 6h6l2 2h10v11H3z",
    image: "M3 4h18v16H3zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 15l-5-5L5 20",
    link: "M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"
  };
  var COLORS = { blue: "#5AA9FF", violet: "#A78BFA", teal: "#2DD4BF", amber: "#F5B342", coral: "#FF7A6B",
    green: "#5ED68A", pink: "#F472B6", slate: "#9AA5B8" };
  var CHIP = { url: "PC", urls: "PC", file: "PC", lock: "PC", update: "PC", claude: "Claude", keys: "Hotkey", ahk: "Script", ipad: "iPad" };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function tint(hex, a) { var n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

  // old Safari friendly requests
  function req(method, url, body, done) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.timeout = 20000;
    if (body) x.setRequestHeader("Content-Type", "application/json");
    x.onload = function () { var j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} done(x.status >= 200 && x.status < 300, j, x.status); };
    x.onerror = x.ontimeout = function () { done(false, null, 0); };
    x.send(body ? JSON.stringify(body) : null);
  }

  var m = location.search.match(/[?&]k=([^&]+)/);
  if (m) { key = decodeURIComponent(m[1]); store(KEY_STORE, key); }
  else { key = store(KEY_STORE) || ""; }
  tab = store(TAB_STORE) || "Favourites";

  var toastTimer;
  function toast(text, bad) {
    var t = $("toast");
    t.textContent = text;
    t.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast" + (bad ? " bad" : ""); }, bad ? 4000 : 1800);
  }

  function setStatus(on, text) {
    $("dot").className = "dot " + (on ? "on" : "off");
    $("stat").textContent = text;
    $("ver").textContent = on && pcVersion ? "v" + pcVersion : "";
  }

  function tick() {
    var d = new Date(), h = d.getHours(), mi = d.getMinutes();
    var part = h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
    var name = data && data.name ? ", " + data.name : "";
    $("hello").textContent = "Good " + part + name;
    var ap = h >= 12 ? "pm" : "am";
    $("time").innerHTML = (h % 12 || 12) + ":" + (mi < 10 ? "0" : "") + mi + "<small>" + ap + "</small>";
    var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var mons = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    $("date").textContent = days[d.getDay()] + " " + d.getDate() + " " + mons[d.getMonth()];
  }

  function allButtons() {
    var out = {};
    for (var i = 0; i < data.groups.length; i++)
      for (var j = 0; j < data.groups[i].buttons.length; j++) out[data.groups[i].buttons[j].id] = data.groups[i].buttons[j];
    return out;
  }

  function tabNames() {
    var n = [];
    if (data.favourites && data.favourites.length) n.push("Favourites");
    for (var i = 0; i < data.groups.length; i++) n.push(data.groups[i].name);
    return n;
  }

  function tabButtons(name) {
    if (name === "Favourites") {
      var all = allButtons(), out = [];
      for (var i = 0; i < data.favourites.length; i++) if (all[data.favourites[i]]) out.push(all[data.favourites[i]]);
      return out;
    }
    for (var g = 0; g < data.groups.length; g++) if (data.groups[g].name === name) return data.groups[g].buttons;
    return [];
  }

  function badgeHtml(b) {
    var col = COLORS[b.color] || COLORS.slate;
    // your own icon sits on its own, no coloured square behind it (round logos stay round)
    if (b.img) return '<div class="badge own"><img src="' + esc(b.img) + '" alt=""></div>';
    return '<div class="badge" style="color:' + col + ';background:' + tint(col, 0.14) + '">' +
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' +
      esc(ICONS[b.icon] || ICONS.link) + '"></path></svg></div>';
  }

  function render() {
    var names = tabNames();
    if (names.indexOf(tab) < 0) tab = names[0];
    var h = "";
    for (var i = 0; i < names.length; i++)
      h += '<button data-tab="' + esc(names[i]) + '" class="' + (names[i] === tab ? "on" : "") + '">' + esc(names[i]) + "</button>";
    $("tabs").innerHTML = h;

    var list = tabButtons(tab);
    h = '<div class="grid">';
    for (var j = 0; j < list.length; j++) {
      var b = list[j];
      h += '<div class="cell"><button class="tile" data-id="' + esc(b.id) + '">' +
        '<span class="top">' + badgeHtml(b) + '<span class="chip">' + esc(CHIP[b.type] || "PC") + "</span></span>" +
        '<span><span class="lbl">' + esc(b.label) + '</span><span class="sub">' + esc(b.sub || "") + "</span></span>" +
        "</button></div>";
    }
    $("main").innerHTML = h + "</div>";
  }

  function flash(el, cls) {
    el.className = "tile " + cls;
    setTimeout(function () { el.className = "tile"; }, 1200);
  }

  function run(el, b) {
    if (b.type === "ipad") { window.open(b.href, "_blank"); return; }
    var sub = el.querySelector(".sub");
    if (b.confirm && el.className.indexOf("arm") < 0) {
      el.className = "tile arm";
      sub.textContent = "Tap again to confirm";
      setTimeout(function () { if (el.className.indexOf("arm") >= 0) { el.className = "tile"; sub.textContent = b.sub || ""; } }, 3000);
      return;
    }
    if (b.confirm) sub.textContent = b.sub || "";
    el.className = "tile busy";
    runId(b.id, b.label, el);
  }

  function runId(id, label, el) {
    req("POST", "/api/run", { k: key, id: id }, function (ok, j, status) {
      if (ok) { if (el) flash(el, "ok"); toast((j && j.msg) || (label + " done")); }
      else if (!status) { if (el) flash(el, "err"); toast("Can't reach the PC", true); setStatus(false, "PC not reachable"); }
      else { if (el) flash(el, "err"); toast((j && j.error) || "Didn't work", true); }
    });
  }

  // ---------- icon picker ----------
  function openSheet(b) {
    sheetBtn = b;
    $("sheetBadge").outerHTML = badgeHtml(b).replace('class="badge"', 'class="badge" id="sheetBadge"');
    $("sheetTitle").textContent = b.label;
    $("resetBtn").style.display = b.img ? "block" : "none";
    $("sheetBg").className = "sheet-bg show";
  }
  function closeSheet() { $("sheetBg").className = "sheet-bg"; $("fileIn").value = ""; sheetBtn = null; }

  function squarePng(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 256, c = document.createElement("canvas");
        c.width = size; c.height = size;
        var ctx = c.getContext("2d");
        var s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        done(c.toDataURL("image/png"));
      };
      img.onerror = function () { done(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { done(null); };
    reader.readAsDataURL(file);
  }

  $("fileIn").addEventListener("change", function () {
    var f = this.files && this.files[0], b = sheetBtn;
    if (!f || !b) return;
    toast("Saving icon");
    squarePng(f, function (png) {
      if (!png) { toast("Couldn't read that image", true); return; }
      req("POST", "/api/icon", { k: key, id: b.id, png: png }, function (ok, j) {
        closeSheet();
        if (ok) { toast("Icon saved"); load(); } else toast((j && j.error) || "Couldn't save it", true);
      });
    });
  });
  $("resetBtn").addEventListener("click", function () {
    var b = sheetBtn; if (!b) return;
    req("POST", "/api/icon", { k: key, id: b.id, reset: true }, function (ok, j) {
      closeSheet();
      if (ok) { toast("Icon reset"); load(); } else toast((j && j.error) || "Couldn't reset it", true);
    });
  });
  $("cancelBtn").addEventListener("click", closeSheet);
  $("sheetBg").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });

  function setEditing(on) {
    editing = on;
    $("wrap").className = "wrap" + (on ? " editing" : "");
    $("editBtn").className = "round" + (on ? " on" : "");
  }
  $("editBtn").addEventListener("click", function () { setEditing(!editing); });
  $("doneBtn").addEventListener("click", function () { setEditing(false); });
  $("updBtn").addEventListener("click", function () { toast("Checking for updates"); runId("update", "Update check", null); });

  // ---------- taps ----------
  $("tabs").addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== this && !t.getAttribute("data-tab")) t = t.parentNode;
    if (!t || t === this) return;
    tab = t.getAttribute("data-tab");
    store(TAB_STORE, tab);
    render();
  });

  $("main").addEventListener("click", function (e) {
    var el = e.target;
    while (el && el !== this && !(el.getAttribute && el.getAttribute("data-id"))) el = el.parentNode;
    if (!el || el === this) return;
    var b = allButtons()[el.getAttribute("data-id")];
    if (!b) return;
    if (editing) openSheet(b); else run(el, b);
  });

  // ---------- loading ----------
  function load() {
    if (!key) {
      $("main").innerHTML = '<div class="msg">Open the address from <b>ipad_address.txt</b> in the panel folder on the PC. It has the key on the end, you only need it once.</div>';
      setStatus(false, "No key yet");
      return;
    }
    req("GET", "/api/buttons?k=" + encodeURIComponent(key) + "&t=" + Date.now(), null, function (ok, j, status) {
      if (!ok) {
        $("main").innerHTML = '<div class="msg">' + (status === 401 ? "The key's wrong. Open the address from ipad_address.txt again." :
          status ? esc((j && j.error) || "Something went wrong") : "Can't reach the PC. Check it's on and the panel is running.") + "</div>";
        setStatus(false, status ? "Problem" : "PC not reachable");
        return;
      }
      data = j;
      document.title = data.title || "Desk Panel";
      render(); tick();
      setStatus(true, "PC connected");
    });
  }

  function ping() {
    req("GET", "/api/ping?t=" + Date.now(), null, function (ok, j) {
      if (!ok) { setStatus(false, "PC not reachable"); return; }
      // the PC updated itself, so reload to pick up the new page
      if (pcVersion && j.version && j.version !== pcVersion) { location.reload(); return; }
      pcVersion = j.version || pcVersion;
      if (!data) load(); else setStatus(true, "PC connected");
    });
  }

  document.addEventListener("visibilitychange", function () { if (!document.hidden) { ping(); load(); } });

  tick(); setInterval(tick, 10000);
  ping(); load(); setInterval(ping, 30000);
})();
</script>
</body>
</html>
